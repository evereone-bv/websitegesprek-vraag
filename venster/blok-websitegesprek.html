<!-- Vraagbaak Websitegesprek: vast blok voor websitegesprek.nl (ontwerp 0.2 §3).
     Laadt niets tot de bezoeker op de knop tikt. Aan/uit staat hier: data-aan="1" is aan (besluit 400).
     Zolang data-aan="0" verschijnt de knop alleen met ?vraagbaak=test in het adres (proef op de telefoon).
     Script zonder dubbele ampersand en zonder kleiner-dan-teken (WordPress beschadigt die, les 12 nov). -->
<div id="wg-vraag-blok" data-aan="0" hidden>
  <button type="button" id="wg-vraag-knop" class="wg-vraag-knop">Stel je vraag hier</button>
</div>
<script>
(function () {
  var b = document.getElementById('wg-vraag-blok');
  if (!b) return;
  var aan = b.getAttribute('data-aan') === '1' || location.search.indexOf('vraagbaak=test') > -1;
  if (!aan) return;
  b.hidden = false;
  document.getElementById('wg-vraag-knop').addEventListener('click', function () {
    if (window.WGVraagbaak) { window.WGVraagbaak.open(); return; }
    var s = document.createElement('script');
    s.src = 'https://vraag.websitegesprek.nl/v1/venster.js';
    s.async = true;
    document.head.appendChild(s);
  });
})();
</script>
